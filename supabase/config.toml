project_id = "tournament-tree"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://127.0.0.1:3005"
additional_redirect_urls = []
enable_signup = false

[auth.email]
# Keep the email/password provider active for the pre-provisioned administrator.
# New accounts remain blocked by auth.enable_signup above.
enable_signup = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.tournament-api]
verify_jwt = false
